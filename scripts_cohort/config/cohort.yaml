# cohort.yaml

slides:
  input_dir: ./tests/data/wsi/Aperio/
  file_list: null
  pattern: "*.svs"

output_dir: ./outputs
saver: hdf5

logging:
  enabled: true
  log_dir: ./outputs/logs
  processed_file: processed.csv
  errors_file: errors.csv

stages:
  tissue_detection:
    enabled: true
    algorithm: gamred
    config_path: ./configs/gamred.yaml
    parallel_workers: 8
    overwrite: false

  artifact_detection:
    enabled: true
    algorithm: grandqc
    config_path: ./configs/grandqc.yaml
    parallel_workers: 1
    overwrite: false
    tissue_source:
      algorithm: gamred