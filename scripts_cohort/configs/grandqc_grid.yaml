artifact_detection:
  enabled: true

  cases:
    - name: constant
      params:
        blending_mode: [constant]
        overlap: [0, 0.25, 0.5, 0.75, 0.9]

    - name: gaussian
      params:
        blending_mode: [gaussian]
        overlap: [0.25, 0.5, 0.75, 0.9]
        blending_sigma: [0.75, 1.25, 1.75, 2.25]