# cohort.yaml

slides:
  input_dir: C:/Users/julia/Desktop/svs/
  file_csv: null
  pattern: "*.svs"

output_dir: C:/Users/julia/Desktop/HistoKit_10_10_2025/
saver: hdf5

logging:
  enabled: true
  log_dir: ./outputs/logs
  processed_file: processed.csv
  errors_file: errors.csv

stages:
  tissue_detection:
    enabled: false
    algorithm: gamred
    config_path: ./gamred.yaml
    parallel_workers: 4
    overwrite: false

  artifact_detection:
    enabled: false
    algorithm: grandqc
    config_path: ./grandqc.yaml
    parallel_workers: 1
    overwrite: false
    tissue_source:
      dir: None

  statistics:
    algorithm: stats
    config_path: ./stats.yaml
    enabled: false
    parallel_workers: 1
    artifact_source:
      dir:   C:/Users/julia/Desktop/HistoKit_10_10_2025/artifact_detection/grandqc/masks/

  geojson:
    algorithm: geojson
    config_path: ./geojson.yaml
    enabled: true
    parallel_workers: 3
    artifact_source:
      dir:  C:/Users/julia/Desktop/HistoKit_10_10_2025/artifact_detection/grandqc/masks/
