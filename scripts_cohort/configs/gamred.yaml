# gamred.yaml

# output
saver: hdf5
save_mag: 10.0
out_dir: ./outputs

# magnification settings
vis_mag: 2.5
tissdet_mag: 10.0

# tissue detection
thr_min: 178.5
split_regions: true

# green pen removal
remove_green_pen: true
thr_green_pen: [15, 120]
disk_radius_green_pen: 9

# black pen removal
remove_black_pen: true
thr_black_pen: [15, 0]
disk_radius_black_pen: 9

# gray stain removal
remove_gray_stains: true

# postprocessing pipeline
postprocess_steps:
  - name: Opening
    params:
      disk_radius: 2

  - name: FillHoles
    params:
      enabled: true

  - name: Opening
    params:
      disk_radius: 2

  - name: RemoveSmallRegions
    params:
      thr_area: null

# outputs / visualizations
collectors:
  - name: ThumbnailCollector

  - name: SegmentationOverlayCollector

  - name: HistogramCollector

  - name: MaskCollector